<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Meta e Recomendações</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>

    <!-- Header padrão -->
    <header>
        <div class="logo">🚀 LevelUp</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="Cadastro.html">Cadastrar Meta</a></li>
                <li><a href="ConsultaByRegistro.html">Consultar Metas</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo principal -->
    <main>
        <h2>Cadastrar Meta e Recomendações</h2>

        <form action="Controll" method="post" accept-charset="UTF-8">
            <fieldset>
                <legend>Dados do Usuário</legend>
                <label for="nome">Nome:</label>
                <input type="text" name="nome" required>

                <label for="cargo">Cargo:</label>
                <input type="text" name="cargo" required>

                <label for="departamento">Departamento:</label>
                <input type="text" name="departamento" required>

                <label for="email">Email:</label>
                <input type="email" name="email" required>

                <label for="registro">Registro:</label>
                <input type="text" name="registro" required>
            </fieldset>

            <fieldset>
                <legend>Dados da Meta</legend>
                <label for="titulo">Título da Meta:</label>
                <input type="text" name="titulo" required>

                <label for="descricao">Descrição da Meta:</label>
                <textarea name="descricao" required></textarea>

                <label for="frequencia">Frequência:</label>
                <select name="frequencia" required>
                    <option value="">Selecione...</option>
                    <option value="diaria">Diária</option>
                    <option value="semanal">Semanal</option>
                    <option value="mensal">Mensal</option>
                </select>

                <label for="etapas">Quantidade de Etapas:</label>
                <input type="number" id="etapas" name="etapas" onInput="gerarCampos()" required>
            </fieldset>

            <div id="recomendacoes"></div>

            <button type="submit" name="ButAction" value="Cadastra">Salvar Meta + Recomendações</button>
        </form>
    </main>

    <!-- Footer padrão -->
    <footer>
        <p>&copy; 2025 LevelUp - Sistema de Metas | Desenvolvido por Higor Castro</p>
    </footer>

    <script>
        function gerarCampos() {
            let qtd = parseInt(document.getElementById("etapas").value) || 0;
            let container = document.getElementById("recomendacoes");
            container.innerHTML = ``;

            for (let i = 1; i <= qtd; i++) {
                container.innerHTML += `
                    <fieldset>
                        <legend>Etapa ${i}</legend>
                        <label for="titulo_${i}">Título:</label>
                        <input type="text" name="titulo_${i}" required>

                        <label for="descricao_${i}">Descrição:</label>
                        <textarea name="descricao_${i}" required></textarea>

                        <label for="url_${i}">URL do curso:</label>
                        <input type="url" name="url_${i}" required>

                        <input type="hidden" name="etapa_${i}" value="${i}">
                    </fieldset>
                    <br>
                `;
            }
        }
    </script>

</body>
</html>
